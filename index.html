<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LatinaTV</title>
  <script defer src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
  <script defer src="https://imasdk.googleapis.com/js/sdkloader/ima3_dai.js"></script>
  <style>
    /* Splash inline — visible inmediatamente, antes de que cargue JS */
    #app-splash {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #00453a;
    }
    #app-splash .splash-spinner {
      position: relative;
      width: 48px;
      height: 48px;
    }
    #app-splash .splash-track {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      border: 4px solid rgba(255,255,255,0.2);
      border-radius: 50%;
    }
    #app-splash .splash-arc {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      border: 4px solid #fff200;
      border-radius: 50%;
      border-top-color: transparent;
      animation: splash-spin 1s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    /* Transición suave al desaparecer */
    #app-splash.splash-hide {
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Splash visible desde el primer instante -->
  <div id="app-splash">
    <div class="splash-spinner">
      <div class="splash-track"></div>
      <div class="splash-arc"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
